# Baut das Sidecar-Container-Image und veröffentlicht es nach GHCR — der
# zweite Auslieferungsweg neben der signierten macOS-App, siehe
# docs/adr/0007-docker-als-zweiter-weg.md.
#
# Bei Pull Requests wird nur gebaut (Buildfehler sollen auffallen), nicht
# veröffentlicht — ein PR aus einem Fork hat kein Recht, ein Image unter
# ghcr.io/icarus-health zu landen.

name: Container

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/icarus-health/icarus

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        # Für den arm64-Anteil des Multi-Arch-Builds — der amd64-Runner kann
        # arm64-Code nur emuliert ausführen, nicht nativ.

      - uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        # Nur zum Veröffentlichen nötig, nicht zum reinen Bauen im PR-Fall —
        # deshalb bedingt, nicht immer.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Bauen (und bei Push/Tag veröffentlichen)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # `load` (für den Rauchtest unten) funktioniert nur für ein
          # einzelnes Zielarchitektur-Image — deshalb bei PRs nur amd64.
          # Beim echten Publish werden beide Architekturen gebaut und direkt
          # nach GHCR geschoben, ohne den Umweg über den lokalen Daemon.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rauchtest
        # Bei PRs liegt das eben gebaute Image lokal (load: true) und wird
        # unter seinem sha-Tag angesprochen. Nach einem echten Publish liegt
        # nichts lokal — das amd64-Image wird von GHCR gezogen. Ein Test der
        # arm64-Variante würde QEMU-Emulation brauchen und liefe vor allem
        # die Emulation, nicht das Image, mit — deshalb bewusst nur amd64.
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker pull --platform linux/amd64 ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
            docker tag ${{ env.IMAGE }}@${{ steps.build.outputs.digest }} icarus-smoke-test:latest
          else
            docker tag $(echo "${{ steps.meta.outputs.tags }}" | head -n1) icarus-smoke-test:latest
          fi

          docker run -d --name icarus-smoke \
            -p 127.0.0.1:8765:8765 \
            -e ICARUS_SIDECAR_TOKEN=rauchtest \
            -e ICARUS_SECRETS_PASSPHRASE=rauchtest \
            icarus-smoke-test:latest

          scheitern() {
            echo "FEHLGESCHLAGEN: $1"
            docker logs icarus-smoke
            docker rm -f icarus-smoke
            exit 1
          }

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 1
          done
          [ "$ok" = "1" ] || scheitern "Sidecar hat innerhalb von 30s nicht geantwortet."

          antwort=$(curl -fsS http://127.0.0.1:8765/health)
          echo "$antwort"
          echo "$antwort" | grep -q '"status":"ok"' || scheitern "Unerwartete /health-Antwort."

          # Die Prüfung, auf die es ankommt: Ohne Token muss jeder Datenzugriff
          # abgewiesen werden. Ein Bild, das versehentlich offen ausliefert,
          # legt das gesamte Gedächtnis frei — das darf nie unbemerkt durch die
          # CI kommen.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/assertions)
          [ "$code" = "401" ] || scheitern "Ohne Token kam $code statt 401 — die API liegt offen."

          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'x-icarus-token: rauchtest' http://127.0.0.1:8765/assertions)
          [ "$code" = "200" ] || scheitern "Mit Token kam $code statt 200."

          # Und die Oberfläche wird ausgeliefert, sonst nützt der Browserweg nichts.
          curl -fsS http://127.0.0.1:8765/ | grep -q "Icarus" \
            || scheitern "Die Oberfläche wird nicht ausgeliefert."

          echo "Rauchtest bestanden. Container bleibt für den Browser-Test aktiv."

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Browser für End-to-End-Test installieren
        working-directory: app
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Vollständiges Backup und Restore im Browser
        working-directory: app
        env:
          ICARUS_E2E_BASE: http://127.0.0.1:8765
          ICARUS_E2E_TOKEN: rauchtest
        run: node e2e/container-backup.mjs

      - name: Container aufräumen
        if: always()
        run: |
          docker logs icarus-smoke || true
          docker rm -f icarus-smoke || true
