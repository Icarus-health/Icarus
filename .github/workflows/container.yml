# Baut das Sidecar-Container-Image und veröffentlicht es nach GHCR — der
# zweite Auslieferungsweg neben der signierten macOS-App.

name: Container

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/icarus-health/icarus

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Bauen (und bei Push/Tag veröffentlichen)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rauchtest
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker pull --platform linux/amd64 ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
            docker tag ${{ env.IMAGE }}@${{ steps.build.outputs.digest }} icarus-smoke-test:latest
          else
            docker tag $(echo "${{ steps.meta.outputs.tags }}" | head -n1) icarus-smoke-test:latest
          fi

          docker run -d --name icarus-smoke \
            -p 127.0.0.1:8765:8765 \
            -e ICARUS_SIDECAR_TOKEN=rauchtest \
            -e ICARUS_SECRETS_PASSPHRASE=rauchtest \
            icarus-smoke-test:latest

          scheitern() {
            echo "FEHLGESCHLAGEN: $1"
            docker logs icarus-smoke
            docker rm -f icarus-smoke
            exit 1
          }

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 1
          done
          [ "$ok" = "1" ] || scheitern "Sidecar hat innerhalb von 30s nicht geantwortet."

          antwort=$(curl -fsS http://127.0.0.1:8765/health)
          echo "$antwort"
          echo "$antwort" | grep -q '"status":"ok"' || scheitern "Unerwartete /health-Antwort."

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/assertions)
          [ "$code" = "401" ] || scheitern "Ohne Token kam $code statt 401 — die API liegt offen."

          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'x-icarus-token: rauchtest' http://127.0.0.1:8765/assertions)
          [ "$code" = "200" ] || scheitern "Mit Token kam $code statt 200."

          curl -fsS http://127.0.0.1:8765/ | grep -q "Icarus" \
            || scheitern "Die Oberfläche wird nicht ausgeliefert."

          echo "Rauchtest bestanden. Container bleibt für die Browser-Tests aktiv."

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Browser für End-to-End-Tests installieren
        working-directory: app
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Python-Connector für Browser-E2E installieren
        run: pip install ./sidecar

      - name: Vollständiges Backup und Restore im Browser
        working-directory: app
        env:
          ICARUS_E2E_BASE: http://127.0.0.1:8765
          ICARUS_E2E_TOKEN: rauchtest
        run: node e2e/container-backup.mjs

      - name: Echter Browserconnector mit manipulierter Webseite
        env:
          PYTHONPATH: sidecar
        run: python sidecar/tests/e2e_playwright_browser.py

      - name: Container aufräumen
        if: always()
        run: |
          docker logs icarus-smoke || true
          docker rm -f icarus-smoke || true
