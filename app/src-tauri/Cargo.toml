[package]
name = "icarus-desktop"
version = "0.1.0"
description = "Icarus — persönliches KI-Betriebssystem"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Von `tauri dev` gesetzt, damit die Devtools verfügbar sind.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
