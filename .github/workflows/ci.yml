name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  sidecar:
    name: Sidecar (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Installieren
        run: |
          python -m pip install --upgrade pip
          pip install ./sidecar pytest jsonschema

      - name: Tests
        run: python -m pytest sidecar/tests -q

      - name: Beispielprofil gegen das Schema
        run: |
          python - <<'PY'
          import json, jsonschema
          schema = json.load(open("schema/self-model.schema.json"))
          jsonschema.Draft202012Validator.check_schema(schema)
          jsonschema.Draft202012Validator(schema).validate(
              json.load(open("schema/beispiel-profil.json")))
          print("Schema und Beispiel sind valide.")
          PY

  app:
    name: Desktop-App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Systembibliotheken
        # Auf Linux braucht Tauri GTK und WebKit. Auf macOS entfällt das.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Sidecar-Platzhalter
        # tauri.conf.json verweist über binaries/* hierher; ohne Datei bricht
        # der Build-Schritt ab. Im Release liegt hier die echte Binary.
        run: touch app/src-tauri/binaries/.platzhalter

      - run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path app/src-tauri/Cargo.toml -- -D warnings
      - run: cargo check --manifest-path app/src-tauri/Cargo.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend-Syntax
        run: node --check app/src/main.js
